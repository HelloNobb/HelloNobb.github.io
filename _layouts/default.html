<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }} - {{ site.role }}</title>
  <meta name="description" content="{{ page.summary | default: site.slogan | strip_newlines }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <p class="find-me">
        {% for link in site.links %}<a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.name }}</a>{% endfor %}
      </p>
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }} - {{ site.role }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>About</a>
        <a href="{{ '/resume/' | relative_url }}"{% if page.url == '/resume/' %} class="active"{% endif %}>Resume</a>
        <a href="{{ '/portfolio/' | relative_url }}"{% if page.url == '/portfolio/' or page.collection == 'projects' %} class="active"{% endif %}>Portfolio</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>© {{ site.time | date: "%Y" }} {{ site.title }}</footer>
  </div>
</body>
</html>
