# 사이트 기본 정보 — [대괄호] 부분을 실제 내용으로 바꾸세요.
title: "[이름]"
tagline: "[한 줄 소개]"
email: "[이메일 주소]"
github_username: "HelloNobb"
lang: ko

# _projects/ 폴더의 파일 하나 = 프로젝트 하나 (목록 + 상세 페이지 자동 생성)
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      type: projects
    values:
      layout: project

exclude:
  - README.md
