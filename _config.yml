slogan: |                       # 줄바꿈이 그대로 표시됩니다
  플레이어가 끊김 없이 즐기는 게임을 만드는 개발자입니다.
  측정으로 원인을 찾고, 무너지지 않는 구조 위에 기능을 쌓습니다.
