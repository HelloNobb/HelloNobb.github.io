  게임의 아이디어가 실제로 플레이할 수 있는 형태로 구현되는 과정에 매력을 느낍니다.
  단순히 기능을 구현하는 데 그치지 않고, 동작 원리를 이해하며 안정적이고 확장 가능한 구조를 고민합니다.
  AI를 협업 도구로 활용하되, 생성된 코드는 직접 이해하고 검증하며, 결과물의 완성도를 높이기 위해 끊임없이 배우고 개선합니다.
avatar: /assets/avatar.png
nickname: "Nobb"              # 프로필 이미지 아래 작은 글씨
