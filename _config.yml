# _projects/ 폴더의 파일 하나 = 프로젝트 하나 (목록 + 상세 페이지 자동 생성)
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      type: projects
    values:
      layout: project

exclude:
  - README.md
  - CLAUDE.md
  - FOR_ME.md
