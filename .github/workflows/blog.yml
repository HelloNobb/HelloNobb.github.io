name: Sync blog posts

# Pulls the latest Tistory posts into _data/blog.json. A commit to main
# makes GitHub Pages rebuild, so new posts show up on the ABOUT page.
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write   # to ask Pages to rebuild (pushes made with GITHUB_TOKEN don't start one)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fetch_blog.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/blog.json; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/blog.json
          git commit -m "Update blog posts"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
        env:
          GH_TOKEN: ${{ github.token }}
